# Add to the 443 server block on Dart (or its own server_name, e.g. panel.radleypropertysolutions.com).
# Static UI from the Vite build; /api proxied to uvicorn.

    location /panel/ {
        alias /opt/ump/frontend/dist/;
        try_files $uri $uri/ /panel/index.html;
    }

    location /panel/api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }

# If served under /panel/ rather than at the root, build the UI with
#   VITE_BASE=/panel/ npm run build
# and set `base: process.env.VITE_BASE ?? '/'` in vite.config.js.
